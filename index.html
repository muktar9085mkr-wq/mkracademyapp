<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MKR Academy — Educational Notes & HSLC 2027 Preparation</title>
    <meta name="description" content="Quality educational notes, chapter-wise study materials, and HSLC 2027 preparation for Class 10 & 9 students in Assamese and English mediums." />
    <meta property="og:title" content="MKR Academy — Educational Notes & HSLC 2027 Preparation" />
    <meta property="og:description" content="Quality educational notes, chapter-wise study materials, and HSLC 2027 preparation for Class 10 & 9 students in Assamese and English mediums." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Fonts for Assamese & English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Suppress external Netlify badge & drawer overlay on mobile navigation -->
    <style>
      #netlify-feedback-drawer,
      [data-netlify-drawer],
      .netlify-badge,
      [data-netlify-badge],
      div[class*="netlify-badge"],
      iframe[id*="netlify"],
      iframe[src*="netlify.com"],
      a[href*="netlify.com"][style*="fixed"],
      a[href*="netlify.com"][style*="absolute"] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      (function() {
        function removeNetlifyBadge() {
          var selectors = '#netlify-feedback-drawer, [data-netlify-drawer], .netlify-badge, [data-netlify-badge], iframe[id*="netlify"], a[href*="netlify.com"]';
          var badges = document.querySelectorAll(selectors);
          badges.forEach(function(el) {
            if (el && el.parentNode) {
              el.style.setProperty('display', 'none', 'important');
              el.style.setProperty('pointer-events', 'none', 'important');
            }
          });
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', removeNetlifyBadge);
        } else {
          removeNetlifyBadge();
        }
        window.addEventListener('load', removeNetlifyBadge);
        var tries = 0;
        var interval = setInterval(function() {
          removeNetlifyBadge();
          tries++;
          if (tries > 20) clearInterval(interval);
        }, 500);
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-red-700 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
