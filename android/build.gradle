plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' // Optional if using Kotlin
    // id 'com.google.gms.google-services' // Enable after placing google-services.json in app/
}

android {
    namespace 'com.mkr.academy'
    compileSdk 34

    defaultConfig {
        applicationId "com.mkr.academy"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Firebase Web Client ID for Credential Manager Google ID Token verification
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"669869297609-l4nf9edmcdjf88621bkhc6o3250oirdi.apps.googleusercontent.com\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Native Android Google Sign-In via Credential Manager
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Firebase Authentication (reuses existing MKR Academy Firebase project)
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-auth'
}
